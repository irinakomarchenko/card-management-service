services:
  postgres:
    image: postgres:15
    container_name: card-postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: card-app
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
